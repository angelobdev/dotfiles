# Chromium flags for Electron apps; electron.py adds them to the desktop entries of the apps listed in
# ~/.config/desktop/electron-apps.conf (Fedora launchers read no flags file). Native Wayland, and text
# fields reported to the compositor, so the on-screen keyboard opens by itself in tablet mode.
--ozone-platform-hint=auto
--enable-wayland-ime
--wayland-text-input-version=3
