# Command-line tools, one part each. Checked by default: the basics.
[fedora.utils]

[fedora.utils.parts.neovim]
default = true
packages = ['neovim']

[fedora.utils.parts.gcc]
default = true
packages = ['gcc']

[fedora.utils.parts.xclip]
default = true
packages = ['xclip']

[fedora.utils.parts.unrar]
default = true
packages = ['unrar']

# FUSE 2, which AppImages need.
[fedora.utils.parts.fuse]
default = true
packages = ['fuse-libs']

[fedora.utils.parts.gh]
default = false
packages = ['gh']
notes = ['Sign in to GitHub: gh auth login']

[fedora.utils.parts.glab]
default = false
packages = ['glab']

[fedora.utils.parts.uv]
default = false
packages = ['uv']

[fedora.utils.parts.wev]
default = false
packages = ['wev']

# Tailscale, with the tray icon of its client for every user session.
[fedora.utils.parts.tailscale]
default = false
packages = ['tailscale']
services = ['tailscaled.service']
user_services = ['tailscale-systray.service']
notes = ['Connect Tailscale: sudo tailscale up']

# The AI Assistant: the Settings section, Super + A and the bar icon need it (the shell hides them without it). Its
# console is herdr (https://herdr.dev, Apache-2.0): the Herdr app and herdr-core, for any coding agent
# (docs/features/ai-assistant.md). Put where their own installers put them (releases.herdr.dev/app/install.sh), from
# the same release archives, checked against these sha256; after that the app updates itself and hc update the core.
[fedora.assistant]
notes = [
    'Install a coding agent (Claude Code, Codex, Antigravity CLI) in Settings → Assistant',
    'Herdr: Super + A opens it as the assistant console; pick the agent it starts in Settings → Assistant',
    'Herdr sends anonymous usage counts once a day: "telemetry": false in ~/.config/herdr-app/settings.json stops it',
]

[[fedora.assistant.archives]]
name = 'herdr-core'
version = '0.1.18'
url = 'https://releases.herdr.dev/core/{version}/herdr-core-linux-{arch}.tar.gz'
sha256 = { x86_64 = '5b2f97cb4b2a9d7a6b2cc5942628203ed9fbb7cc0c2b4b09ad8a6f5648e246b7', aarch64 = 'cf33393cf950bb763734dc3e16610ab9daf8492391a4ef0de56026cd7f752853' }
latest = 'https://releases.herdr.dev/core/latest.json'
changes = 'https://github.com/herdrdev/herdr-core/releases'
unpack = { 'herdr-core' = '.local/bin/herdr-core' }
links = { '.local/bin/hc' = '.local/bin/herdr-core' }

[[fedora.assistant.archives]]
name = 'herdr-app'
version = '0.1.13'
url = 'https://releases.herdr.dev/app/{version}/herdr-app-linux-{arch}.tar.gz'
sha256 = { x86_64 = '77b0be72a46ca14bb367365a04164641f914b3a69712bac391d39c56a959bef4', aarch64 = '2e5bb05c47cffbad018ad34217ea4c816476d7eb842692f740798c9020f0281e' }
latest = 'https://releases.herdr.dev/app/latest.json'
changes = 'https://github.com/herdrdev/herdr-app/releases'
unpack = { 'herdr-app' = '.local/share/herdr-app' }
links = { '.local/bin/herdr-app' = '.local/share/herdr-app/herdr-app', '.local/share/icons/hicolor/scalable/apps/herdr-app.svg' = '.local/share/herdr-app/herdr-app.svg' }

[fedora.assistant.archives.entries]
'.local/share/applications/herdr-app.desktop' = '''
[Desktop Entry]
Type=Application
Name=Herdr
Comment=Terminals and coding agents that keep running
Exec={home}/.local/bin/herdr-app
Icon=herdr-app
Terminal=false
Categories=Development;
StartupWMClass=herdr-app
'''

# Docker.
[fedora.containers]
packages = ['moby-engine', 'docker-compose']
services = ['docker.service']
groups = ['docker']

# The Radio panel's player: mpv, on MPRIS through mpv-mpris, with yt-dlp for YouTube, and Qt Multimedia for the video
# in the panel. ytfzf, which searches faster, is not packaged for Fedora: radio.py falls back to yt-dlp.
[fedora.radio]
packages = ['mpv', 'mpv-mpris', 'yt-dlp', 'qt6-qtmultimedia']

# Games: gcc caches the optional renderer scaling workaround.
[fedora.gaming]
repos = ['rpmfusion-free', 'rpmfusion-nonfree']
packages = ['gcc']

# Steam, with what 32-bit Intel games need.
[fedora.gaming.parts.steam]
default = true
packages = ['steam', 'mesa-dri-drivers(x86-32)', 'mesa-vulkan-drivers(x86-32)', 'vulkan-loader(x86-32)']

# A Steam launcher that scales the client for the monitor it opens on (desktop-steam).
[fedora.gaming.parts.steam-hidpi]
default = true
stow = ['steam-hidpi']

[fedora.gaming.parts.gamescope]
default = true
packages = ['gamescope']

# Arch Linux: the official repositories (core, extra, and multilib for gaming), plus three apps from the AUR.
# Package names checked with pacman -Si and pacman -F on 2026-11-05. Profiles as on Fedora, except: no repository
# for Hyprland (extra has it, headers and session entry included), no swaps (Arch's ffmpeg and media drivers are the
# full builds), no firewall zone or sshd change (Arch enables neither), and no tablet sign-in yet (it needs PAM
# edited without authselect).
[arch]
versions = ['rolling']

[arch.repos.multilib]
kind = 'pacman'
name = 'multilib'
include = '/etc/pacman.d/mirrorlist'

[arch.core]
packages = [
    # Session. uwsm runs the hyprland-uwsm entry that the hyprland package installs for GDM; hyprpm is a package of its own.
    'gdm', 'accountsservice', 'hyprland', 'hyprpm', 'uwsm', 'hyprland-guiutils', 'quickshell', 'stow',
    'hypridle', 'hyprlock', 'hyprpaper', 'hyprsunset', 'kitty', 'dbus', 'polkit', 'oo7',
    'xorg-xwayland', 'xorg-xrdb', 'mesa', 'vulkan-intel', 'vulkan-radeon',
    # Portals.
    'xdg-desktop-portal', 'xdg-desktop-portal-hyprland', 'xdg-desktop-portal-gtk',
    # Audio, network and power. pactl is in libpulse, bluetoothctl in bluez-utils. ffmpeg (for wf-recorder) needs a
    # JACK library, and pacman would pick jack2, a second sound server: PipeWire's instead.
    'pipewire', 'pipewire-pulse', 'pipewire-jack', 'wireplumber', 'libpulse',
    'networkmanager', 'wpa_supplicant', 'nm-connection-editor',
    'bluez', 'bluez-utils', 'upower', 'tuned', 'tuned-ppd', 'brightnessctl', 'ddcutil',
    # Shell helpers. pacman-contrib has checkupdates, for the update icon and the installer, which needs fakeroot.
    'python', 'python-gobject', 'imagemagick', 'libnotify', 'libical', 'evolution-data-server',
    'gnome-online-accounts-gtk', 'matugen', 'jq', 'ripgrep', 'grim', 'slurp', 'wl-clipboard', 'cliphist',
    'wf-recorder', 'btop', 'fastfetch', 'flatpak', 'xdg-user-dirs', 'xdg-utils', 'dconf', 'pacman-contrib', 'fakeroot',
    # Color picker, text from a screen area, the launcher's calculator (qalc is in libqalculate) and file search.
    'hyprpicker', 'tesseract', 'tesseract-data-ita', 'tesseract-data-eng', 'libqalculate', 'fd',
    # The emoji picker: Unicode's list, CLDR's names (annotations) and those of flags and keycaps (unicode-cldr).
    'unicode-emoji', 'unicode-cldr-annotations', 'unicode-cldr',
    # What plays, for the lock screen.
    'playerctl',
    # Drives and phones.
    'udiskie', 'libayatana-appindicator', 'udisks2', 'gvfs', 'gvfs-afc', 'gvfs-gphoto2', 'usbmuxd', 'libimobiledevice',
    # Look. breeze-cursors alone: breeze is the whole Plasma style.
    'qt5ct', 'qt6ct', 'qt6-svg', 'qt6-imageformats', 'papirus-icon-theme', 'adwaita-icon-theme', 'adw-gtk-theme',
    'adwaita-cursors', 'breeze-cursors', 'fontconfig', 'adwaita-fonts', 'noto-fonts-emoji', 'inter-font',
    'ttf-ibm-plex', 'ttf-jetbrains-mono', 'ttf-fira-code',
    # Apps the shell opens.
    'nautilus', 'gnome-calculator',
    # The login shell and its plugins; Powerlevel10k and zsh-autocomplete come from clones below.
    'zsh', 'zsh-autosuggestions', 'zsh-syntax-highlighting', 'git', 'fzf', 'zoxide', 'eza', 'bat',
    # Codecs: Arch's ffmpeg and media drivers have every one; these are the GStreamer plugins that use them (OpenH264
    # is in bad).
    'gst-plugins-bad', 'gst-plugins-ugly', 'gst-libav', 'libheif',
]
login_shell = '/usr/bin/zsh'
services = ['NetworkManager.service', 'accounts-daemon.service', 'bluetooth.service', 'tuned.service', 'tuned-ppd.service']
user_services = ['oo7-daemon.service']
notes = ['Sign in to your calendars with gnome-online-accounts-gtk.']

[[arch.core.clones]]
repo = 'https://github.com/romkatv/powerlevel10k'
commit = '7ddd1b2715c3844275214347a3572ac1fdd6dc39'
path = '.local/share/zsh/plugins/powerlevel10k'

[[arch.core.clones]]
repo = 'https://github.com/marlonrichert/zsh-autocomplete'
commit = '52ce8176d280d58a4a2af6a829d2266fffae568c'  # 26.08.04
path = '.local/share/zsh/plugins/zsh-autocomplete'
track = 'tags'

# Root for one operation started from Settings, behind one pkexec prompt (shell/.local/libexec/desktop/privileged.py).
# A copy owned by root, never a link: pkexec must not run a file the desktop user can change.
[[arch.core.files]]
path = '/usr/local/libexec/dotfiles-desktop/root-broker'
source = 'scripts/privileged/root-broker'
mode = '0755'

# A laptop, in parts, checked as on Fedora. linux-firmware-intel holds the Wi-Fi, Bluetooth, GPU, VSC, NPU and ISH
# firmware that Fedora splits in several packages. The 2-in-1 parts are the tablet profile.
[arch.hardware]

[arch.hardware.parts.intel]
default = 'intel'
packages = ['linux-firmware-intel', 'vpl-gpu-rt', 'libvpl', 'libva-utils', 'intel-media-driver', 'thermald', 'intel-lpmd']
services = ['thermald.service', 'intel_lpmd.service']

[arch.hardware.parts.audio]
default = 'intel'
packages = ['linux-firmware-cirrus', 'sof-firmware', 'alsa-ucm-conf', 'alsa-utils']

[arch.hardware.parts.camera]
default = 'camera'
packages = ['libcamera', 'libcamera-ipa', 'pipewire-libcamera']

# The fingerprint reader, and the polkit prompt that tries it first (scripts/privileged/polkit-1.arch).
[arch.hardware.parts.fingerprint]
default = 'fingerprint'
packages = ['fprintd']
notes = ['Enroll your fingerprint: fprintd-enroll. On Arch it signs in at GDM, unlocks the lock screen and answers the polkit prompt; sudo still asks for the password.']

[[arch.hardware.parts.fingerprint.files]]
path = '/etc/pam.d/polkit-1'
source = 'scripts/privileged/polkit-1.arch'

[[arch.hardware.parts.fingerprint.files]]
path = '/usr/local/libexec/desktop-fingerprint'
source = 'scripts/privileged/desktop-fingerprint'
mode = '0755'

[arch.hardware.parts.firmware]
default = true
packages = ['bolt', 'fwupd']

# A 2-in-1: rotation, the stylus and the Hyprgrass gestures. The tablet sign-in is not ported yet.
[arch.tablet]
packages = ['iio-sensor-proxy', 'libwacom']

[[arch.tablet.firmware]]
product = 'HP OmniBook Ultra Flip Laptop 14-fh0xxx'
purpose = 'Screen rotation'
source = 'HP SoftPaq sp158489, Driver/IshHeciExtension/FWImage/0003/ishC_0207.bin'
target = '/usr/lib/firmware/intel/ish/ish_lnlm_12128606.bin'
sha256 = 'aafe1129e21ad0b082333e66dfbd81540c627a9f5d41f8707053362b6de7474f'
size = 838144

[[arch.tablet.files]]
path = '/etc/modules-load.d/hid-sensors.conf'
content = '''
intel_ishtp_hid
hid_sensor_hub
'''

# Building the Hyprland plugins, in parts as on Fedora: the hyprland package has the headers, and Arch splits no -devel
# packages.
[arch.plugins]
packages = ['git', 'gcc', 'make', 'pkgconf', 'meson', 'ninja', 'patch', 'cpio', 'glm', 'lua', 'pango', 'libxcursor', 'nlohmann-json']

[arch.plugins.parts.hyprspace]
default = true

[arch.plugins.parts.hyprglass]
default = true

[arch.plugins.parts.hyprcapture]
default = true
packages = [
    'cmake', 'libjpeg-turbo', 'qt6-svg', 'qt6-wayland', 'layer-shell-qt', 'opencv', 'pipewire', 'libpulse', 'fftw', 'ffmpeg',
    'x265', 'libde265',
]

# Everything below is opt-in: add the profile to --profiles.

# Desktop apps, one part each, as on Fedora. Zen, 1Password and VS Code are not in the Arch repositories: AUR
# PKGBUILDs at a pinned commit, which makepkg (base-devel) builds. Updating one: install-desktop.py pins (review the
# PKGBUILD changes it links), install-desktop.py pins --update, then install-desktop.py apply; or Updates in
# install-tui.py.
[arch.apps]

[arch.apps.parts.zen]
default = true
packages = ['base-devel']

[[arch.apps.parts.zen.aur]]
package = 'zen-browser-bin'
commit = '12bff888a8299aedcef68cca18378cfac24474d8'
version = '1.24b-1'

[arch.apps.parts.onepassword]
default = false
packages = ['base-devel']

[[arch.apps.parts.onepassword.aur]]
package = '1password'
commit = 'a01e3b048ebbe341d6e6b500304a315a342a7d84'
version = '8.12.44-33'
key = 'https://downloads.1password.com/linux/keys/1password.asc'

[[arch.apps.parts.onepassword.files]]
path = '/etc/1password/custom_allowed_browsers'
content = '''
zen-bin
'''

[arch.apps.parts.vscode]
default = false
packages = ['base-devel']

[[arch.apps.parts.vscode.aur]]
package = 'visual-studio-code-bin'
commit = 'a2c863ea6e8fcfb1395e1f7f61d9e7e85d0466aa'
version = '1.145.0-1'

[arch.apps.parts.loupe]
default = true
packages = ['loupe']

[arch.apps.parts.papers]
default = true
packages = ['papers']

[arch.apps.parts.showtime]
default = true
packages = ['showtime']

# Command-line tools, one part each, as on Fedora.
[arch.utils]

[arch.utils.parts.neovim]
default = true
packages = ['neovim']

[arch.utils.parts.gcc]
default = true
packages = ['gcc']

[arch.utils.parts.xclip]
default = true
packages = ['xclip']

[arch.utils.parts.unrar]
default = true
packages = ['unrar']

[arch.utils.parts.fuse]
default = true
packages = ['fuse2']

[arch.utils.parts.gh]
default = false
packages = ['github-cli']
notes = ['Sign in to GitHub: gh auth login']

[arch.utils.parts.glab]
default = false
packages = ['glab']

[arch.utils.parts.uv]
default = false
packages = ['uv']

[arch.utils.parts.wev]
default = false
packages = ['wev']

# Arch's tailscale has no tray unit: the tray icon is not set up.
[arch.utils.parts.tailscale]
default = false
packages = ['tailscale']
services = ['tailscaled.service']
notes = ['Connect Tailscale: sudo tailscale up']

# The AI Assistant: the Settings section, Super + A and the bar icon need it (the shell hides them without it). Its
# console is herdr (https://herdr.dev, Apache-2.0): the Herdr app and herdr-core, for any coding agent
# (docs/features/ai-assistant.md). Put where their own installers put them (releases.herdr.dev/app/install.sh), from
# the same release archives, checked against these sha256; after that the app updates itself and hc update the core.
[arch.assistant]
notes = [
    'Install a coding agent (Claude Code, Codex, Antigravity CLI) in Settings → Assistant',
    'Herdr: Super + A opens it as the assistant console; pick the agent it starts in Settings → Assistant',
    'Herdr sends anonymous usage counts once a day: "telemetry": false in ~/.config/herdr-app/settings.json stops it',
]

[[arch.assistant.archives]]
name = 'herdr-core'
version = '0.1.18'
url = 'https://releases.herdr.dev/core/{version}/herdr-core-linux-{arch}.tar.gz'
sha256 = { x86_64 = '5b2f97cb4b2a9d7a6b2cc5942628203ed9fbb7cc0c2b4b09ad8a6f5648e246b7', aarch64 = 'cf33393cf950bb763734dc3e16610ab9daf8492391a4ef0de56026cd7f752853' }
latest = 'https://releases.herdr.dev/core/latest.json'
changes = 'https://github.com/herdrdev/herdr-core/releases'
unpack = { 'herdr-core' = '.local/bin/herdr-core' }
links = { '.local/bin/hc' = '.local/bin/herdr-core' }

[[arch.assistant.archives]]
name = 'herdr-app'
version = '0.1.13'
url = 'https://releases.herdr.dev/app/{version}/herdr-app-linux-{arch}.tar.gz'
sha256 = { x86_64 = '77b0be72a46ca14bb367365a04164641f914b3a69712bac391d39c56a959bef4', aarch64 = '2e5bb05c47cffbad018ad34217ea4c816476d7eb842692f740798c9020f0281e' }
latest = 'https://releases.herdr.dev/app/latest.json'
changes = 'https://github.com/herdrdev/herdr-app/releases'
unpack = { 'herdr-app' = '.local/share/herdr-app' }
links = { '.local/bin/herdr-app' = '.local/share/herdr-app/herdr-app', '.local/share/icons/hicolor/scalable/apps/herdr-app.svg' = '.local/share/herdr-app/herdr-app.svg' }

[arch.assistant.archives.entries]
'.local/share/applications/herdr-app.desktop' = '''
[Desktop Entry]
Type=Application
Name=Herdr
Comment=Terminals and coding agents that keep running
Exec={home}/.local/bin/herdr-app
Icon=herdr-app
Terminal=false
Categories=Development;
StartupWMClass=herdr-app
'''

# Docker.
[arch.containers]
packages = ['docker', 'docker-compose']
services = ['docker.service']
groups = ['docker']

# The Radio panel's player: mpv, on MPRIS through mpv-mpris, with ytfzf and yt-dlp for YouTube, and Qt Multimedia
# (its FFmpeg backend) for the video in the panel.
[arch.radio]
packages = ['mpv', 'mpv-mpris', 'yt-dlp', 'ytfzf', 'qt6-multimedia', 'qt6-multimedia-ffmpeg']

# Games, from multilib: gcc caches the optional renderer scaling workaround.
[arch.gaming]
repos = ['multilib']
packages = ['gcc']

# Steam, with the 32-bit drivers games need.
[arch.gaming.parts.steam]
default = true
packages = ['steam', 'lib32-mesa', 'lib32-vulkan-intel', 'lib32-vulkan-radeon']

# A Steam launcher that scales the client for the monitor it opens on (desktop-steam).
[arch.gaming.parts.steam-hidpi]
default = true
stow = ['steam-hidpi']

[arch.gaming.parts.gamescope]
default = true
packages = ['gamescope']
