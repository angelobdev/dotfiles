# What install-desktop.py sets up, by distribution and profile.
#
# A distribution with no table here is refused as not verified. Porting one means adding a table with the same
# profile keys and a module with the functions of fedora.py, using package names checked on that distribution.
# versions lists the VERSION_ID values verified; a rolling release, which has none, is 'rolling' (its BUILD_ID).
#
# Profile keys: repos, packages, swaps, services, user_services, disable, files, groups, stow, flatpaks, firewall_zone, auth, notes.
# parts: [<distro>.<profile>.parts.<name>] tables with the same keys, each picked on its own as <profile>.<name>; the
#   profile's own keys come with any of them. default: whether a part starts checked: true, false, or a detection of
#   install-desktop.py (DETECT: intel, camera, fingerprint), true where it finds the hardware.
# swaps: [old, new] pairs; new replaces old where old is installed, and old is never installed alongside it.
# stow: optional Stow packages (scripts/stow.py --with).
# exclude: packages kept out of every install, such as the weak dependencies of GNOME Shell that GDM brings.
# login_shell: the shell the installing user logs in with.
# clones: [[...]] tables of repo, commit and path (under the home), for what the distribution does not package.
#   track = 'tags' follows the release tags; without it, the head of the default branch.
# firmware: [[...]] vendor blobs nobody may redistribute, for one DMI product_name: install-desktop.py --firmware DIR
#   finds them by sha256 (and size) and installs them to target, then rebuilds the initramfs.
# aur: [[...]] tables of package, commit and version (Arch only): the AUR PKGBUILD at that commit, built with makepkg.
#   key is the URL of the PGP key its sources are signed with. install-desktop.py pins shows newer commits.
# archives: [[...]] tables of name, version, url ({version} and {arch} in it), sha256 per architecture (x86_64,
#   aarch64) and latest (the release manifest install-desktop.py pins reads): a release tarball unpacked into the home
#   as the user. unpack maps each top-level member to its path under the home; links (path = target, both under the
#   home) and entries (path = content, {home} for the home folder) are made beside it unless something is there.
#   Installed only while every unpack path is missing: these programs update themselves.

# The desktop itself, whatever the distribution calls its packages.
[verify]
commands = [
    'Hyprland', 'hyprctl', 'hyprpm', 'uwsm', 'qs', 'stow', 'kitty', 'python3',
    'hyprpaper', 'hypridle', 'hyprlock', 'udiskie', 'magick', 'wl-copy', 'wl-paste', 'cliphist',
    'notify-send', 'wpctl', 'brightnessctl', 'nmcli', 'wf-recorder', 'slurp', 'qt5ct', 'nautilus',
    'dbus-update-activation-environment', 'xrdb', 'xdg-user-dir', 'xdg-open',
]

[fedora]
versions = ['45']

# needs: packages a repository's command needs before it can be added (dnf copr comes with dnf5-plugins, which
# Server and minimal installs lack). Installed by the repo tools step and recorded like any package.
[fedora.repos.hyprland]
kind = 'copr'
name = 'lionheartp/Hyprland'
needs = ['dnf5-plugins']

[fedora.repos.zen]
kind = 'copr'
name = 'sneexy/zen-browser'
needs = ['dnf5-plugins']

[fedora.repos.rpmfusion-free]
kind = 'release'
package = 'rpmfusion-free-release'
url = 'https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{release}.noarch.rpm'

[fedora.repos.rpmfusion-nonfree]
kind = 'release'
package = 'rpmfusion-nonfree-release'
url = 'https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{release}.noarch.rpm'

[fedora.repos.1password]
kind = 'file'
file = '1password.repo'
content = '''
[1password]
name=1Password Stable Channel
baseurl=https://downloads.1password.com/linux/rpm/stable/$basearch
enabled=1
gpgcheck=1
gpgkey=https://downloads.1password.com/linux/keys/1password.asc
'''

[fedora.repos.vscode]
kind = 'file'
file = 'vscode.repo'
content = '''
[code]
name=Visual Studio Code
baseurl=https://packages.microsoft.com/yumrepos/vscode
enabled=1
autorefresh=1
type=rpm-md
gpgcheck=1
gpgkey=https://packages.microsoft.com/keys/microsoft.asc
'''


# The desktop: everything the session, the shell and its panels call.
[fedora.core]
repos = ['hyprland', 'rpmfusion-free', 'rpmfusion-nonfree']
packages = [
    # Session. hyprland-uwsm is only a weak dependency of hyprland, and GDM needs its session entry.
    'gdm', 'accountsservice', 'hyprland', 'hyprland-uwsm', 'hyprland-guiutils', 'quickshell', 'stow',
    'hypridle', 'hyprlock', 'hyprpaper', 'hyprsunset', 'kitty', 'dbus-tools', 'polkit', 'oo7-daemon',
    'xorg-x11-server-Xwayland', 'xrdb', 'mesa-dri-drivers', 'mesa-vulkan-drivers',
    # Portals.
    'xdg-desktop-portal', 'xdg-desktop-portal-hyprland', 'xdg-desktop-portal-gtk',
    # Audio, network and power.
    'pipewire', 'pipewire-pulseaudio', 'wireplumber', 'pulseaudio-utils',
    'NetworkManager', 'NetworkManager-wifi', 'NetworkManager-bluetooth', 'nm-connection-editor',
    'bluez', 'upower', 'tuned', 'tuned-ppd', 'brightnessctl', 'ddcutil',
    # Shell helpers.
    'python3', 'python3-gobject', 'ImageMagick', 'libnotify', 'libical-glib', 'evolution-data-server',
    'gnome-online-accounts-gtk', 'matugen', 'jq', 'ripgrep', 'grim', 'slurp', 'wl-clipboard', 'cliphist',
    'wf-recorder', 'btop', 'fastfetch', 'flatpak', 'xdg-user-dirs', 'xdg-utils', 'dconf',
    # Color picker (Super + Shift + P), text from a screen area (tesseract, Italian and English), the launcher's
    # calculator and unit conversions (qalc) and its file search (fd).
    'hyprpicker', 'tesseract', 'tesseract-langpack-ita', 'tesseract-langpack-eng', 'qalculate', 'fd-find',
    # The emoji picker: Unicode's list and CLDR's names in every language.
    'unicode-emoji', 'cldr-emoji-annotation',
    # What plays, for the lock screen.
    'playerctl',
    # Drives and phones.
    # udiskie's tray icon is an AppIndicator (StatusNotifierItem) for the bar's tray.
    'udiskie', 'libayatana-appindicator-gtk3', 'udisks2', 'gvfs', 'gvfs-afc', 'gvfs-gphoto2', 'usbmuxd', 'libimobiledevice-utils',
    # Look.
    'qt5ct', 'qt6ct', 'qt6-qtsvg', 'qt6-qtimageformats', 'papirus-icon-theme', 'adwaita-icon-theme', 'adw-gtk3-theme',
    'adwaita-cursor-theme', 'breeze-cursor-theme', 'fontconfig', 'adwaita-sans-fonts', 'adwaita-mono-fonts',
    'google-noto-color-emoji-fonts', 'rsms-inter-fonts', 'ibm-plex-sans-fonts', 'ibm-plex-mono-fonts',
    'jetbrains-mono-fonts', 'fira-code-fonts',
    # Apps the shell opens.
    'nautilus', 'gnome-calculator',
    # The login shell and its plugins; Powerlevel10k and zsh-autocomplete come from clones below.
    'zsh', 'zsh-autosuggestions', 'zsh-syntax-highlighting', 'git-core', 'fzf', 'zoxide', 'eza', 'bat',
    # Codecs: the patent-encumbered ones from RPM Fusion, in place of the free builds Fedora ships.
    'gstreamer1-plugins-bad-freeworld', 'gstreamer1-plugins-ugly', 'gstreamer1-plugin-libav', 'gstreamer1-plugin-openh264',
    'libheif-freeworld', 'pipewire-codec-aptx',
]
swaps = [['ffmpeg-free', 'ffmpeg'], ['libva-intel-media-driver', 'intel-media-driver']]
login_shell = '/usr/bin/zsh'
services = ['NetworkManager.service', 'accounts-daemon.service', 'bluetooth.service', 'tuned.service', 'tuned-ppd.service']
# Has no D-Bus activation: passwords are stored nowhere until it runs, and pam_oo7 waits for it at login.
user_services = ['oo7-daemon.service']
# Recommended by gnome-shell and gnome-control-center, which GDM requires; none of them works outside GNOME or is used here.
exclude = ['gnome-tour', 'malcontent-control', 'gnome-color-manager', 'gnome-remote-desktop', 'rygel']
disable = ['cockpit.socket']
notes = ['Sign in to your calendars with gnome-online-accounts-gtk.']

# Not packaged by Fedora. Updating them: install-desktop.py pins --update, then install-desktop.py apply, or Updates
# in install-tui.py. Powerlevel10k's releases stopped at v1.20.0: it follows its branch.
[[fedora.core.clones]]
repo = 'https://github.com/romkatv/powerlevel10k'
commit = '7ddd1b2715c3844275214347a3572ac1fdd6dc39'
path = '.local/share/zsh/plugins/powerlevel10k'

[[fedora.core.clones]]
repo = 'https://github.com/marlonrichert/zsh-autocomplete'
commit = '52ce8176d280d58a4a2af6a829d2266fffae568c'  # 26.08.04
path = '.local/share/zsh/plugins/zsh-autocomplete'
track = 'tags'

# Root for one operation started from Settings, behind one pkexec prompt (shell/.local/libexec/desktop/privileged.py).
# A copy owned by root, never a link: pkexec must not run a file the desktop user can change.
[[fedora.core.files]]
path = '/usr/local/libexec/dotfiles-desktop/root-broker'
source = 'scripts/privileged/root-broker'
mode = '0755'

# A laptop, in parts: each checked by default where the installer finds it (default = a detection, install-desktop.py
# DETECT), or always. The 2-in-1 parts are the tablet profile.
[fedora.hardware]
disable = ['sshd.service']
firewall_zone = 'FedoraWorkstation'

# Intel: Wi-Fi and Bluetooth firmware, the GPU and its video decoding (the RPM Fusion driver, as core swaps it), the
# NPU, and the power daemons.
[fedora.hardware.parts.intel]
default = 'intel'
packages = [
    'iwlwifi-mvm-firmware', 'iwlbluetooth-firmware', 'intel-gpu-firmware', 'intel-npu-firmware',
    'intel-vpl-gpu-rt', 'libvpl', 'libva-utils', 'intel-media-driver', 'thermald', 'intel-lpmd',
]
services = ['thermald.service', 'intel_lpmd.service']

# Sound: the SOF firmware of Intel's audio DSP, Cirrus amplifiers, and the ALSA use-case profiles.
[fedora.hardware.parts.audio]
default = 'intel'
packages = ['intel-audio-firmware', 'cirrus-audio-firmware', 'alsa-sof-firmware', 'alsa-ucm', 'alsa-utils']

# The camera: libcamera for MIPI cameras (Intel IPU), with the firmware of its vision sensing controller.
[fedora.hardware.parts.camera]
default = 'camera'
packages = ['libcamera', 'libcamera-ipa', 'pipewire-plugin-libcamera', 'intel-vsc-firmware']

# The fingerprint reader, and the polkit prompt that tries it first, then the password, or the password on
# "Use password" (scripts/privileged/polkit-1.fedora).
[fedora.hardware.parts.fingerprint]
default = 'fingerprint'
packages = ['fprintd', 'fprintd-pam']
# authselect's with-fingerprint: GDM and sudo try the reader (Workstation has it on already, Server does not).
auth = ['with-fingerprint']
notes = ['Enroll your fingerprint: fprintd-enroll']

[[fedora.hardware.parts.fingerprint.files]]
path = '/etc/pam.d/polkit-1'
source = 'scripts/privileged/polkit-1.fedora'

[[fedora.hardware.parts.fingerprint.files]]
path = '/usr/local/libexec/desktop-fingerprint'
source = 'scripts/privileged/desktop-fingerprint'
mode = '0755'

# Firmware updates (fwupd) and Thunderbolt devices (bolt).
[fedora.hardware.parts.firmware]
default = true
packages = ['bolt', 'fwupd']

# A 2-in-1 (this laptop: an HP OmniBook Ultra Flip): the accelerometer behind screen rotation, the stylus, the
# sign-in that skips the fingerprint reader while folded, and the Hyprgrass touchscreen gestures (built only with
# this profile).
[fedora.tablet]
packages = ['iio-sensor-proxy', 'libwacom', 'fprintd', 'fprintd-pam']
# The fingerprint as hardware.fingerprint has it, and the tablet sign-in on top (scripts/tablet-auth.sh).
auth = ['with-fingerprint', 'custom/desktop-tablet']

# The accelerometer behind screen rotation. linux-firmware has the HP blob for another SKU only.
[[fedora.tablet.firmware]]
product = 'HP OmniBook Ultra Flip Laptop 14-fh0xxx'
purpose = 'Screen rotation'
source = 'HP SoftPaq sp158489, Driver/IshHeciExtension/FWImage/0003/ishC_0207.bin'
target = '/usr/lib/firmware/intel/ish/ish_lnlm_12128606.bin'
sha256 = 'aafe1129e21ad0b082333e66dfbd81540c627a9f5d41f8707053362b6de7474f'
size = 838144

[[fedora.tablet.files]]
path = '/etc/modules-load.d/hid-sensors.conf'
content = '''
intel_ishtp_hid
hid_sensor_hub
'''

# Building the Hyprland plugins: the tools and Hyprland's headers here, and each plugin as a part with what it needs
# beyond them (scripts/hyprpm: Hyprspace and hyprglass are make, HyprCapture is CMake and Qt; Hyprgrass, which tablet
# brings, is meson). hyprland-devel stays installed: the login check reads its version.
[fedora.plugins]
packages = [
    'hyprland-devel', 'git', 'gcc-c++', 'make', 'pkgconf-pkg-config', 'meson', 'ninja-build', 'patch', 'cpio',
    'glm-devel', 'lua-devel', 'pango-devel', 'libXcursor-devel', 'json-devel',
]

# The overview (Super + Tab's workspaces, the corner of the bar, four fingers up).
[fedora.plugins.parts.hyprspace]
default = true

# Liquid glass on the shell and the windows.
[fedora.plugins.parts.hyprglass]
default = true

# Screenshots with an editor (Super + Shift + S, Print). ffmpeg-devel needs the RPM Fusion ffmpeg, which core swaps in.
[fedora.plugins.parts.hyprcapture]
default = true
packages = [
    'cmake', 'libjpeg-turbo-devel', 'qt6-qtsvg-devel', 'qt6-qtwayland-devel', 'layer-shell-qt-devel', 'opencv-devel',
    'pipewire-devel', 'pulseaudio-libs-devel', 'fftw-devel', 'ffmpeg-devel', 'x265-devel', 'libde265-devel',
]

# Everything below is opt-in: add the profile to --profiles.

# Desktop apps, one part each. Checked by default: the browser and the viewers.
[fedora.apps]

[fedora.apps.parts.zen]
default = true
repos = ['zen']
packages = ['zen-browser']

[fedora.apps.parts.onepassword]
default = false
repos = ['1password']
packages = ['1password']

[[fedora.apps.parts.onepassword.files]]
path = '/etc/1password/custom_allowed_browsers'
content = '''
zen-bin
'''

[fedora.apps.parts.vscode]
default = false
repos = ['vscode']
packages = ['code']

# GNOME viewers for images, PDFs and videos.
[fedora.apps.parts.loupe]
default = true
packages = ['loupe']

[fedora.apps.parts.papers]
default = true
packages = ['papers']

[fedora.apps.parts.showtime]
default = true
