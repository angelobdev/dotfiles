$font = Adwaita Sans

general {
    hide_cursor = true
}
auth {
    pam:enabled = true
    pam:module = hyprlock
    fingerprint:enabled = true
    fingerprint:ready_message = Touch the fingerprint sensor to unlock
    fingerprint:present_message = Reading fingerprint…
    fingerprint:retry_delay = 250
}
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    color = rgba(191a1dff)
}
label {
    monitor =
    text = $TIME
    color = rgba(f0f0f2ff)
    font_size = 84
    font_family = $font
    position = 0, -90
    halign = center
    valign = top
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(f0f0f2dd)
    font_size = 19
    font_family = $font
    position = 0, -215
    halign = center
    valign = top
}
label {
    monitor =
    text = $USER
    color = rgba(f0f0f2ff)
    font_size = 22
    font_family = $font
    position = 0, 258
    halign = center
    valign = bottom
}
input-field {
    monitor =
    size = 300, 52
    outline_thickness = 1
    rounding = 26
    outer_color = rgba(ffffff28)
    inner_color = rgba(292b30e6)
    font_color = rgba(f0f0f2ff)
    check_color = rgba(d4d6dcff)
    fail_color = rgba(e99595ff)
    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL
    capslock_color = rgba(d8c49fff)
    fade_on_empty = false
    dots_spacing = 0.3
    position = 0, 180
    halign = center
    valign = bottom
}
label {
    monitor =
    text = $FPRINTPROMPT
    color = rgba(b8bbc1ff)
    font_size = 12
    font_family = $font
    position = 0, 138
    halign = center
    valign = bottom
}
label {
    monitor =
    text = $FPRINTFAIL
    color = rgba(e99595ff)
    font_size = 12
    font_family = $font
    position = 0, 108
    halign = center
    valign = bottom
}
label {
    monitor =
    text = $LAYOUT
    color = rgba(b8bbc1cc)
    font_size = 11
    font_family = $font
    position = 0, 65
    halign = center
    valign = bottom
}
