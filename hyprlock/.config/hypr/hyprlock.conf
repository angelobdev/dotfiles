$font = Adwaita Sans

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    color = rgba(101826ff)
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    rounding = 18
    outer_color = rgba(89b4fa99)
    inner_color = rgba(1a2537dd)
    font_color = rgba(e1e9f5ff)
    check_color = rgba(89b4faff)
    fail_color = rgba(f38ba8ff)
    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL
    capslock_color = rgba(f9e2afff)
    fade_on_empty = false
    dots_spacing = 0.3
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(e1e9f5ff)
    font_size = 88
    font_family = $font
    position = 0, 140
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(a5b4ccff)
    font_size = 20
    font_family = $font
    position = 0, 55
    halign = center
    valign = center
}
label {
    monitor =
    text = $USER
    color = rgba(a5b4ccff)
    font_size = 16
    font_family = $font
    position = 0, -145
    halign = center
    valign = center
}
