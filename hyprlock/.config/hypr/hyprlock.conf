$font = Adwaita Sans

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    color = rgba(191a1dff)
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    rounding = 18
    outer_color = rgba(d4d6dc99)
    inner_color = rgba(292b30dd)
    font_color = rgba(f0f0f2ff)
    check_color = rgba(d4d6dcff)
    fail_color = rgba(e99595ff)
    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL
    capslock_color = rgba(d8c49fff)
    fade_on_empty = false
    dots_spacing = 0.3
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(f0f0f2ff)
    font_size = 88
    font_family = $font
    position = 0, 140
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(b8bbc1ff)
    font_size = 20
    font_family = $font
    position = 0, 55
    halign = center
    valign = center
}
label {
    monitor =
    text = $USER
    color = rgba(b8bbc1ff)
    font_size = 16
    font_family = $font
    position = 0, -145
    halign = center
    valign = center
}
