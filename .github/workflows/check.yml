name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.fedora }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        fedora: [45]
    steps:
      - name: Install the tools
        run: |
          dnf -y install dnf5-plugins
          dnf -y copr enable lionheartp/Hyprland
          dnf -y install --setopt=install_weak_deps=False \
            desktop-file-utils gcc hyprland lua matugen python3 python3-cmarkgfm qt6-qtdeclarative-devel \
            shadow-utils stow util-linux zsh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the checks
        run: |
          # check.sh and its tests skip these when they are missing: here that would hide a failure.
          for tool in cc desktop-file-validate lua matugen stow zsh /usr/lib64/qt6/bin/qmllint /usr/lib64/qt6/bin/qmltestrunner; do
            command -v "$tool"
          done
          python3 -c 'import cmarkgfm'
          # Hyprland refuses to start as root, and the job runs as root. It also needs a runtime directory.
          useradd --create-home ci
          chown -R ci "$PWD"
          install -d -m 700 -o ci /tmp/runtime
          XDG_RUNTIME_DIR=/tmp/runtime runuser -u ci -- ./scripts/check.sh

  check-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 15
    steps:
      - name: Install the tools
        run: |
          pacman -Syu --noconfirm --needed \
            desktop-file-utils gcc git hyprland lua matugen python python-cmarkgfm qt6-declarative stow zsh
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the checks
        run: |
          # As on Fedora: nothing check.sh would skip may be missing.
          for tool in cc desktop-file-validate lua matugen stow zsh /usr/lib/qt6/bin/qmllint /usr/lib/qt6/bin/qmltestrunner; do
            command -v "$tool"
          done
          python3 -c 'import cmarkgfm'
          useradd --create-home ci
          chown -R ci "$PWD"
          install -d -m 700 -o ci /tmp/runtime
          XDG_RUNTIME_DIR=/tmp/runtime runuser -u ci -- ./scripts/check.sh
