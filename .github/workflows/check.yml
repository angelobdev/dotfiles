name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install the tools
        run: |
          dnf -y install dnf-plugins-core
          dnf -y copr enable lionheartp/Hyprland
          dnf -y install --setopt=install_weak_deps=False \
            desktop-file-utils gcc hyprland python3 qt6-qtdeclarative-devel shadow-utils util-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the checks
        run: |
          # check.sh skips these when they are missing: here that would hide a failure.
          for tool in cc desktop-file-validate Hyprland /usr/lib64/qt6/bin/qmllint /usr/lib64/qt6/bin/qmltestrunner; do
            command -v "$tool"
          done
          # Hyprland refuses to start as root, and the job runs as root. It also needs a runtime directory.
          useradd --create-home ci
          chown -R ci "$PWD"
          install -d -m 700 -o ci /tmp/runtime
          XDG_RUNTIME_DIR=/tmp/runtime runuser -u ci -- ./scripts/check.sh
