name: Install

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install.yml
      - scripts/install-desktop.py
      - scripts/install-tui.py
      - scripts/install/**
      - scripts/install-hypr-plugins.py
      - scripts/hyprpm/bundle.py
      - scripts/stow.py
      - scripts/tablet-auth.sh
      - scripts/tests/install-container.sh
      - scripts/tests/install-container-arch.sh
  pull_request:
    paths:
      - .github/workflows/install.yml
      - scripts/install-desktop.py
      - scripts/install-tui.py
      - scripts/install/**
      - scripts/install-hypr-plugins.py
      - scripts/hyprpm/bundle.py
      - scripts/stow.py
      - scripts/tablet-auth.sh
      - scripts/tests/install-container.sh
      - scripts/tests/install-container-arch.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    container: fedora:45
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the installer on a fresh system
        run: bash scripts/tests/install-container.sh "$PWD"
        env:
          # Without apps, for the disk of the runner. The plugins take long: only when started by hand.
          PROFILES: core,hardware,hardware.intel,hardware.audio,hardware.camera,hardware.fingerprint,hardware.firmware,tablet,plugins,assistant,gaming.steam-hidpi,radio
          COMPILE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

  install-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the installer on a fresh system
        run: bash scripts/tests/install-container-arch.sh "$PWD"
        env:
          PROFILES: core,hardware,hardware.intel,hardware.audio,hardware.camera,hardware.fingerprint,hardware.firmware,tablet,plugins,assistant,gaming.steam-hidpi,radio
          COMPILE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
