name: Install

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install.yml
      - scripts/install-desktop.py
      - scripts/install/**
      - scripts/tests/install-container.sh
  pull_request:
    paths:
      - .github/workflows/install.yml
      - scripts/install-desktop.py
      - scripts/install/**
      - scripts/tests/install-container.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    container: fedora:45
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the installer on a fresh system
        run: bash scripts/tests/install-container.sh "$PWD"
        env:
          # Without apps, for the disk of the runner. The plugins take long: only when started by hand.
          PROFILES: core,hardware,plugins
          COMPILE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
